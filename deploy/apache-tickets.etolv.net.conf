# Apache vhost for tickets.etolv.net — the PROPER way to host this app: the
# document root points AT this copy's public/ folder, so the app owns the
# domain instead of sitting reachable through a subdirectory path.
#
# This is the config deploy/build-release.sh's own header describes as
# "case 1" — no BASE_URL/ASSET_URL needed at build time, no asset() edge
# cases, nothing about the earlier /tickets-system/public/ subdirectory setup
# carries over. If ASSET_URL is set in this app's .env from that earlier
# setup, remove it — it would now point assets at the wrong place.
#
# Install:
#   sudo cp deploy/apache-tickets.etolv.net.conf /etc/apache2/sites-available/tickets.etolv.net.conf
#   sudo a2enmod rewrite                      # .htaccess needs mod_rewrite; safe to re-run if already on
#   sudo a2ensite tickets.etolv.net.conf
#   sudo apache2ctl configtest                # check for typos before reloading
#   sudo systemctl reload apache2
#
# Then, ONLY after the plain http:// vhost above is confirmed working
# (visit http://tickets.etolv.net and see the app, not a 403/404):
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d tickets.etolv.net
#
# certbot edits this file in place to add the :443 block and a redirect from
# :80 to :443 — do not hand-add SSL directives here yourself first, or certbot
# has two overlapping configs to reconcile instead of one to extend.
#
# After certbot succeeds, on the server:
#   - set APP_URL=https://tickets.etolv.net in .env (this app's own root URL)
#   - remove ASSET_URL from .env if it's set — this vhost makes it unnecessary
#   - php artisan config:clear && php artisan config:cache
#   - if assets were last built with BASE_URL/ASSET_URL set, rebuild plain:
#     npm run build   (no BASE_URL — this deployment doesn't need it)

<VirtualHost *:80>
    ServerName tickets.etolv.net

    DocumentRoot /var/www/html/tickets-system/public

    <Directory /var/www/html/tickets-system/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/tickets.etolv.net-error.log
    CustomLog ${APACHE_LOG_DIR}/tickets.etolv.net-access.log combined
</VirtualHost>
