; ============================================================================
;  Production PHP settings for this app. Append to (or merge into) the php.ini
;  the web server uses, then restart it.
;
;  These are not optional tuning. With opcache off, PHP recompiles every file
;  on every request, and the measured difference on this app at 5,000 tickets
;  was:
;
;      screen              opcache OFF   opcache ON   target
;      ------------------  -----------   ----------   ------
;      قائمة التذاكر            354ms         84ms    300ms
;      تفاصيل التذكرة            360ms         78ms    250ms
;      الكاليندر (شهر)           502ms        234ms    350ms
;      البحث العالمي            276ms         68ms    200ms
;
;  Every § 4 target fails without it and passes with it. Nothing else changed.
; ============================================================================

zend_extension=opcache

opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Leave timestamp validation on unless you redeploy by restarting php.
; revalidate_freq=2 means a changed file is picked up within 2 seconds, which
; costs a stat() per file and is worth it for a self-hosted app.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; ---- upload limits, to match F04.2 (5 MB per file, 10 files per ticket) ----
; The app enforces its own limits and re-checks every byte with finfo; these
; only need to be large enough not to truncate a legitimate upload before the
; app ever sees it.
upload_max_filesize=8M
post_max_size=64M
max_file_uploads=20

; The Excel import reads up to 5,000 rows (F02). It runs in a queue above 500
; rows, but the inline path still needs room.
memory_limit=256M
max_execution_time=120

; ---- hardening ----
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On

session.cookie_httponly=1
session.use_strict_mode=1
